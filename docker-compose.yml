# =============================================================================
# FishDex - Docker Compose
# AI Server with HTTPS reverse proxy (Caddy)
# =============================================================================

x-logging: &x-logging
  logging:
    driver: json-file
    options:
      max-file: "5"
      max-size: "10m"

services:
  # ===========================================================================
  # CADDY - HTTPS Reverse Proxy
  # ===========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: fishdex-caddy
    restart: unless-stopped
    ports:
      - "${AI_SERVER_HTTPS_PORT:-8443}:443"
      - "${AI_SERVER_HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - fishdex-network
    depends_on:
      ai-server:
        condition: service_healthy
    <<: *x-logging

  # ===========================================================================
  # SERVIDOR DE IA - FastAPI
  # ===========================================================================
  ai-server:
    build:
      context: ./ai-server
      dockerfile: Dockerfile
    container_name: fishdex-ai-server
    restart: unless-stopped
    ports:
      - "${AI_SERVER_PORT:-8000}:8000"
    environment:
      - MODEL_PATH=/app/model/fish_model.pt
      - MAX_VIDEO_SIZE_MB=${MAX_VIDEO_SIZE_MB:-50}
      - FISHDEX_ENVIRONMENT=${FISHDEX_ENVIRONMENT:-production}
      - FISHDEX_SKIP_AUTH=false
      - FISHDEX_AI_SERVER_SECRET=${FISHDEX_AI_SERVER_SECRET}
      - FISHDEX_CLIENT_SECRET=${FISHDEX_CLIENT_SECRET}
      - FISHDEX_DASHBOARD_SECRET=${FISHDEX_DASHBOARD_SECRET}
      - FISHDEX_SERVER_DATA_DIR=/app/data
      - FISHDEX_PRIVATE_DATA_DIR=/app/data/private
      - FISHDEX_FISH_DOCUMENTS_DIR=/app/data/private/fish_documents
      - FISHDEX_FISH_MEDIA_DIR=/app/data/storage/fish_media
      - FISHDEX_JOB_ARTIFACTS_DIR=/app/data/storage/jobs
      - FISHDEX_EMBEDDINGS_DB_PATH=/app/data/embeddings/fishdex_embeddings.sqlite
      - FISHDEX_REID_SIMILARITY_THRESHOLD=${FISHDEX_REID_SIMILARITY_THRESHOLD:-0.82}
      - FISHDEX_NEARBY_AREA_RADIUS_KM=5.0
    volumes:
      - ./ai-server/app:/app/app
      - ./ai-server/model:/app/model
      - ./ai-server/models:/app/models
      - ./ai-server/data:/app/data
    networks:
      - fishdex-network
    <<: *x-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# =============================================================================
# VOLUMES AND NETWORKS
# =============================================================================
volumes:
  caddy-data:
  caddy-config:

networks:
  fishdex-network:
    driver: bridge
