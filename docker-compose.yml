# =============================================================================
# FishDex - Docker Compose
# Levanta Appwrite self-hosted + Servidor FastAPI de IA en la misma red
# =============================================================================

x-logging: &x-logging
  logging:
    driver: json-file
    options:
      max-file: "5"
      max-size: "10m"

services:
  # ===========================================================================
  # CADDY - HTTPS Reverse Proxy
  # ===========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: fishdex-caddy
    restart: unless-stopped
    ports:
      - "${AI_SERVER_HTTPS_PORT:-8443}:443"
      - "${AI_SERVER_HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - fishdex-network
    depends_on:
      ai-server:
        condition: service_healthy
    <<: *x-logging

  # ===========================================================================
  # SERVIDOR DE IA - FastAPI
  # ===========================================================================
  ai-server:
    build:
      context: ./ai-server
      dockerfile: Dockerfile
    container_name: fishdex-ai-server
    restart: unless-stopped
    ports:
      - "${AI_SERVER_PORT:-8000}:8000"
    environment:
      - MODEL_PATH=/app/model/fish_model.pt
      - MAX_VIDEO_SIZE_MB=${MAX_VIDEO_SIZE_MB:-50}
      - APPWRITE_ENDPOINT=${APPWRITE_ENDPOINT:-http://appwrite/v1}
      - APPWRITE_PROJECT_ID=${APPWRITE_PROJECT_ID}
      - APPWRITE_API_KEY=${APPWRITE_API_KEY}
      - FISHDEX_ENVIRONMENT=${FISHDEX_ENVIRONMENT:-production}
      - FISHDEX_SKIP_AUTH=false
    volumes:
      - ./ai-server/model:/app/model
    networks:
      - fishdex-network
    depends_on:
      - appwrite
    <<: *x-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # APPWRITE - Backend as a Service
  # ===========================================================================
  appwrite:
    image: appwrite/appwrite:1.6
    container_name: fishdex-appwrite
    restart: unless-stopped
    ports:
      - "${APPWRITE_PORT:-80}:80"
      - "${APPWRITE_PORT_SSL:-443}:443"
    environment:
      - _APP_ENV=${_APP_ENV:-production}
      - _APP_LOCALE=${_APP_LOCALE:-es}
      - _APP_CONSOLE_WHITELIST_ROOT=${_APP_CONSOLE_WHITELIST_ROOT:-enabled}
      - _APP_CONSOLE_WHITELIST_EMAILS=${_APP_CONSOLE_WHITELIST_EMAILS}
      - _APP_CONSOLE_WHITELIST_IPS=${_APP_CONSOLE_WHITELIST_IPS}
      - _APP_SYSTEM_EMAIL_NAME=${_APP_SYSTEM_EMAIL_NAME:-FishDex}
      - _APP_SYSTEM_EMAIL_ADDRESS=${_APP_SYSTEM_EMAIL_ADDRESS:-noreply@fishdex.app}
      - _APP_SYSTEM_SECURITY_EMAIL_ADDRESS=${_APP_SYSTEM_SECURITY_EMAIL_ADDRESS:-security@fishdex.app}
      - _APP_OPTIONS_ABUSE=${_APP_OPTIONS_ABUSE:-enabled}
      - _APP_OPTIONS_FORCE_HTTPS=${_APP_OPTIONS_FORCE_HTTPS:-disabled}
      - _APP_OPENSSL_KEY_V1=${_APP_OPENSSL_KEY_V1}
      - _APP_DOMAIN=${_APP_DOMAIN:-localhost}
      - _APP_DOMAIN_TARGET=${_APP_DOMAIN_TARGET:-localhost}
      - _APP_DOMAIN_FUNCTIONS=${_APP_DOMAIN_FUNCTIONS:-functions.localhost}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=${_APP_DB_USER:-appwrite}
      - _APP_DB_PASS=${_APP_DB_PASS:-password}
      - _APP_INFLUXDB_HOST=influxdb
      - _APP_INFLUXDB_PORT=8086
      - _APP_STATSD_HOST=telegraf
      - _APP_STATSD_PORT=8125
      - _APP_STORAGE_LIMIT=${_APP_STORAGE_LIMIT:-52428800}
      - _APP_STORAGE_PREVIEW_LIMIT=${_APP_STORAGE_PREVIEW_LIMIT:-20000000}
      - _APP_FUNCTIONS_SIZE_LIMIT=${_APP_FUNCTIONS_SIZE_LIMIT:-30000000}
      - _APP_FUNCTIONS_TIMEOUT=${_APP_FUNCTIONS_TIMEOUT:-900}
      - _APP_FUNCTIONS_BUILD_TIMEOUT=${_APP_FUNCTIONS_BUILD_TIMEOUT:-900}
      - _APP_EXECUTOR_SECRET=${_APP_EXECUTOR_SECRET}
      - _APP_EXECUTOR_HOST=http://appwrite-executor/v1
      - _APP_LOGGING_PROVIDER=${_APP_LOGGING_PROVIDER}
      - _APP_LOGGING_CONFIG=${_APP_LOGGING_CONFIG}
      - _APP_MAINTENANCE_INTERVAL=${_APP_MAINTENANCE_INTERVAL:-86400}
      - _APP_SMS_PROVIDER=${_APP_SMS_PROVIDER}
      - _APP_SMS_FROM=${_APP_SMS_FROM}
      - _APP_GRAPHQL_MAX_BATCH_SIZE=${_APP_GRAPHQL_MAX_BATCH_SIZE:-10}
      - _APP_GRAPHQL_MAX_COMPLEXITY=${_APP_GRAPHQL_MAX_COMPLEXITY:-250}
      - _APP_GRAPHQL_MAX_DEPTH=${_APP_GRAPHQL_MAX_DEPTH:-3}
    volumes:
      - appwrite-uploads:/storage/uploads
      - appwrite-cache:/storage/cache
      - appwrite-config:/storage/config
      - appwrite-certificates:/storage/certificates
      - appwrite-functions:/storage/functions
    networks:
      - fishdex-network
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    <<: *x-logging

  appwrite-realtime:
    image: appwrite/appwrite:1.6
    container_name: fishdex-appwrite-realtime
    entrypoint: realtime
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      - _APP_ENV=${_APP_ENV:-production}
      - _APP_OPENSSL_KEY_V1=${_APP_OPENSSL_KEY_V1}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=${_APP_DB_USER:-appwrite}
      - _APP_DB_PASS=${_APP_DB_PASS:-password}
      - _APP_LOGGING_PROVIDER=${_APP_LOGGING_PROVIDER}
      - _APP_LOGGING_CONFIG=${_APP_LOGGING_CONFIG}
    networks:
      - fishdex-network
    depends_on:
      - mariadb
      - redis
    <<: *x-logging

  appwrite-worker-audits:
    image: appwrite/appwrite:1.6
    container_name: fishdex-appwrite-worker-audits
    entrypoint: worker-audits
    restart: unless-stopped
    environment:
      - _APP_ENV=${_APP_ENV:-production}
      - _APP_OPENSSL_KEY_V1=${_APP_OPENSSL_KEY_V1}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=${_APP_DB_USER:-appwrite}
      - _APP_DB_PASS=${_APP_DB_PASS:-password}
      - _APP_LOGGING_PROVIDER=${_APP_LOGGING_PROVIDER}
      - _APP_LOGGING_CONFIG=${_APP_LOGGING_CONFIG}
    networks:
      - fishdex-network
    depends_on:
      - redis
      - mariadb
    <<: *x-logging

  appwrite-worker-webhooks:
    image: appwrite/appwrite:1.6
    container_name: fishdex-appwrite-worker-webhooks
    entrypoint: worker-webhooks
    restart: unless-stopped
    environment:
      - _APP_ENV=${_APP_ENV:-production}
      - _APP_OPENSSL_KEY_V1=${_APP_OPENSSL_KEY_V1}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_LOGGING_PROVIDER=${_APP_LOGGING_PROVIDER}
      - _APP_LOGGING_CONFIG=${_APP_LOGGING_CONFIG}
    networks:
      - fishdex-network
    depends_on:
      - redis
    <<: *x-logging

  appwrite-worker-deletes:
    image: appwrite/appwrite:1.6
    container_name: fishdex-appwrite-worker-deletes
    entrypoint: worker-deletes
    restart: unless-stopped
    environment:
      - _APP_ENV=${_APP_ENV:-production}
      - _APP_OPENSSL_KEY_V1=${_APP_OPENSSL_KEY_V1}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=${_APP_DB_USER:-appwrite}
      - _APP_DB_PASS=${_APP_DB_PASS:-password}
      - _APP_STORAGE_DEVICE=${_APP_STORAGE_DEVICE:-local}
      - _APP_LOGGING_PROVIDER=${_APP_LOGGING_PROVIDER}
      - _APP_LOGGING_CONFIG=${_APP_LOGGING_CONFIG}
      - _APP_EXECUTOR_SECRET=${_APP_EXECUTOR_SECRET}
      - _APP_EXECUTOR_HOST=http://appwrite-executor/v1
    volumes:
      - appwrite-uploads:/storage/uploads
      - appwrite-cache:/storage/cache
      - appwrite-functions:/storage/functions
      - appwrite-certificates:/storage/certificates
    networks:
      - fishdex-network
    depends_on:
      - redis
      - mariadb
    <<: *x-logging

  appwrite-worker-databases:
    image: appwrite/appwrite:1.6
    container_name: fishdex-appwrite-worker-databases
    entrypoint: worker-databases
    restart: unless-stopped
    environment:
      - _APP_ENV=${_APP_ENV:-production}
      - _APP_OPENSSL_KEY_V1=${_APP_OPENSSL_KEY_V1}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=${_APP_DB_USER:-appwrite}
      - _APP_DB_PASS=${_APP_DB_PASS:-password}
      - _APP_LOGGING_PROVIDER=${_APP_LOGGING_PROVIDER}
      - _APP_LOGGING_CONFIG=${_APP_LOGGING_CONFIG}
    networks:
      - fishdex-network
    depends_on:
      - redis
      - mariadb
    <<: *x-logging

  appwrite-worker-builds:
    image: appwrite/appwrite:1.6
    container_name: fishdex-appwrite-worker-builds
    entrypoint: worker-builds
    restart: unless-stopped
    environment:
      - _APP_ENV=${_APP_ENV:-production}
      - _APP_OPENSSL_KEY_V1=${_APP_OPENSSL_KEY_V1}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=${_APP_DB_USER:-appwrite}
      - _APP_DB_PASS=${_APP_DB_PASS:-password}
      - _APP_LOGGING_PROVIDER=${_APP_LOGGING_PROVIDER}
      - _APP_LOGGING_CONFIG=${_APP_LOGGING_CONFIG}
      - _APP_EXECUTOR_SECRET=${_APP_EXECUTOR_SECRET}
      - _APP_EXECUTOR_HOST=http://appwrite-executor/v1
      - _APP_STORAGE_DEVICE=${_APP_STORAGE_DEVICE:-local}
    volumes:
      - appwrite-functions:/storage/functions
    networks:
      - fishdex-network
    depends_on:
      - redis
      - mariadb
    <<: *x-logging

  appwrite-worker-certificates:
    image: appwrite/appwrite:1.6
    container_name: fishdex-appwrite-worker-certificates
    entrypoint: worker-certificates
    restart: unless-stopped
    environment:
      - _APP_ENV=${_APP_ENV:-production}
      - _APP_OPENSSL_KEY_V1=${_APP_OPENSSL_KEY_V1}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=${_APP_DB_USER:-appwrite}
      - _APP_DB_PASS=${_APP_DB_PASS:-password}
      - _APP_DOMAIN=${_APP_DOMAIN:-localhost}
      - _APP_DOMAIN_TARGET=${_APP_DOMAIN_TARGET:-localhost}
      - _APP_LOGGING_PROVIDER=${_APP_LOGGING_PROVIDER}
      - _APP_LOGGING_CONFIG=${_APP_LOGGING_CONFIG}
    volumes:
      - appwrite-config:/storage/config
      - appwrite-certificates:/storage/certificates
    networks:
      - fishdex-network
    depends_on:
      - redis
      - mariadb
    <<: *x-logging

  appwrite-worker-functions:
    image: appwrite/appwrite:1.6
    container_name: fishdex-appwrite-worker-functions
    entrypoint: worker-functions
    restart: unless-stopped
    environment:
      - _APP_ENV=${_APP_ENV:-production}
      - _APP_OPENSSL_KEY_V1=${_APP_OPENSSL_KEY_V1}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=${_APP_DB_USER:-appwrite}
      - _APP_DB_PASS=${_APP_DB_PASS:-password}
      - _APP_EXECUTOR_SECRET=${_APP_EXECUTOR_SECRET}
      - _APP_EXECUTOR_HOST=http://appwrite-executor/v1
      - _APP_LOGGING_PROVIDER=${_APP_LOGGING_PROVIDER}
      - _APP_LOGGING_CONFIG=${_APP_LOGGING_CONFIG}
    networks:
      - fishdex-network
    depends_on:
      - redis
      - mariadb
      - appwrite-executor
    <<: *x-logging

  appwrite-executor:
    image: appwrite/appwrite:1.6
    container_name: fishdex-appwrite-executor
    entrypoint: executor
    restart: unless-stopped
    stop_signal: SIGINT
    environment:
      - _APP_ENV=${_APP_ENV:-production}
      - _APP_OPENSSL_KEY_V1=${_APP_OPENSSL_KEY_V1}
      - _APP_EXECUTOR_SECRET=${_APP_EXECUTOR_SECRET}
      - _APP_FUNCTIONS_RUNTIMES=${_APP_FUNCTIONS_RUNTIMES:-node-18.0}
      - _APP_FUNCTIONS_TIMEOUT=${_APP_FUNCTIONS_TIMEOUT:-900}
      - _APP_DOCKER_HUB_USERNAME=${_APP_DOCKER_HUB_USERNAME}
      - _APP_DOCKER_HUB_PASSWORD=${_APP_DOCKER_HUB_PASSWORD}
      - _APP_LOGGING_PROVIDER=${_APP_LOGGING_PROVIDER}
      - _APP_LOGGING_CONFIG=${_APP_LOGGING_CONFIG}
      - _APP_STORAGE_DEVICE=${_APP_STORAGE_DEVICE:-local}
      - OPEN_RUNTIMES_NETWORK=fishdex-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - appwrite-functions:/storage/functions
      - /tmp:/tmp
    networks:
      - fishdex-network
    depends_on:
      - redis
    <<: *x-logging

  appwrite-worker-mails:
    image: appwrite/appwrite:1.6
    container_name: fishdex-appwrite-worker-mails
    entrypoint: worker-mails
    restart: unless-stopped
    environment:
      - _APP_ENV=${_APP_ENV:-production}
      - _APP_OPENSSL_KEY_V1=${_APP_OPENSSL_KEY_V1}
      - _APP_SYSTEM_EMAIL_NAME=${_APP_SYSTEM_EMAIL_NAME:-FishDex}
      - _APP_SYSTEM_EMAIL_ADDRESS=${_APP_SYSTEM_EMAIL_ADDRESS:-noreply@fishdex.app}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_SMTP_HOST=${_APP_SMTP_HOST}
      - _APP_SMTP_PORT=${_APP_SMTP_PORT}
      - _APP_SMTP_SECURE=${_APP_SMTP_SECURE}
      - _APP_SMTP_USERNAME=${_APP_SMTP_USERNAME}
      - _APP_SMTP_PASSWORD=${_APP_SMTP_PASSWORD}
      - _APP_LOGGING_PROVIDER=${_APP_LOGGING_PROVIDER}
      - _APP_LOGGING_CONFIG=${_APP_LOGGING_CONFIG}
    networks:
      - fishdex-network
    depends_on:
      - redis
    <<: *x-logging

  appwrite-worker-messaging:
    image: appwrite/appwrite:1.6
    container_name: fishdex-appwrite-worker-messaging
    entrypoint: worker-messaging
    restart: unless-stopped
    environment:
      - _APP_ENV=${_APP_ENV:-production}
      - _APP_OPENSSL_KEY_V1=${_APP_OPENSSL_KEY_V1}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=${_APP_DB_USER:-appwrite}
      - _APP_DB_PASS=${_APP_DB_PASS:-password}
      - _APP_LOGGING_PROVIDER=${_APP_LOGGING_PROVIDER}
      - _APP_LOGGING_CONFIG=${_APP_LOGGING_CONFIG}
      - _APP_SMS_PROVIDER=${_APP_SMS_PROVIDER}
      - _APP_SMS_FROM=${_APP_SMS_FROM}
    networks:
      - fishdex-network
    depends_on:
      - redis
    <<: *x-logging

  appwrite-maintenance:
    image: appwrite/appwrite:1.6
    container_name: fishdex-appwrite-maintenance
    entrypoint: maintenance
    restart: unless-stopped
    environment:
      - _APP_ENV=${_APP_ENV:-production}
      - _APP_OPENSSL_KEY_V1=${_APP_OPENSSL_KEY_V1}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=${_APP_DB_USER:-appwrite}
      - _APP_DB_PASS=${_APP_DB_PASS:-password}
      - _APP_MAINTENANCE_INTERVAL=${_APP_MAINTENANCE_INTERVAL:-86400}
      - _APP_LOGGING_PROVIDER=${_APP_LOGGING_PROVIDER}
      - _APP_LOGGING_CONFIG=${_APP_LOGGING_CONFIG}
    networks:
      - fishdex-network
    depends_on:
      - redis
      - mariadb
    <<: *x-logging

  appwrite-usage:
    image: appwrite/appwrite:1.6
    container_name: fishdex-appwrite-usage
    entrypoint: usage
    restart: unless-stopped
    environment:
      - _APP_ENV=${_APP_ENV:-production}
      - _APP_OPENSSL_KEY_V1=${_APP_OPENSSL_KEY_V1}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_DB_HOST=mariadb
      - _APP_DB_PORT=3306
      - _APP_DB_SCHEMA=appwrite
      - _APP_DB_USER=${_APP_DB_USER:-appwrite}
      - _APP_DB_PASS=${_APP_DB_PASS:-password}
      - _APP_INFLUXDB_HOST=influxdb
      - _APP_INFLUXDB_PORT=8086
      - _APP_LOGGING_PROVIDER=${_APP_LOGGING_PROVIDER}
      - _APP_LOGGING_CONFIG=${_APP_LOGGING_CONFIG}
    networks:
      - fishdex-network
    depends_on:
      - redis
      - mariadb
      - influxdb
    <<: *x-logging

  appwrite-schedule:
    image: appwrite/appwrite:1.6
    container_name: fishdex-appwrite-schedule
    entrypoint: schedule
    restart: unless-stopped
    environment:
      - _APP_ENV=${_APP_ENV:-production}
      - _APP_OPENSSL_KEY_V1=${_APP_OPENSSL_KEY_V1}
      - _APP_REDIS_HOST=redis
      - _APP_REDIS_PORT=6379
      - _APP_LOGGING_PROVIDER=${_APP_LOGGING_PROVIDER}
      - _APP_LOGGING_CONFIG=${_APP_LOGGING_CONFIG}
    networks:
      - fishdex-network
    depends_on:
      - redis
    <<: *x-logging

  # ===========================================================================
  # SERVICIOS DE SOPORTE
  # ===========================================================================
  mariadb:
    image: mariadb:10.11
    container_name: fishdex-mariadb
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${_APP_DB_ROOT_PASS:-rootpassword}
      - MYSQL_DATABASE=appwrite
      - MYSQL_USER=${_APP_DB_USER:-appwrite}
      - MYSQL_PASSWORD=${_APP_DB_PASS:-password}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - fishdex-network
    command: >
      --innodb-flush-method=fsync
      --innodb-flush-log-at-trx-commit=2
    <<: *x-logging
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: fishdex-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - fishdex-network
    <<: *x-logging

  influxdb:
    image: appwrite/influxdb:1.5.0
    container_name: fishdex-influxdb
    restart: unless-stopped
    volumes:
      - influxdb-data:/var/lib/influxdb
    networks:
      - fishdex-network
    <<: *x-logging

  telegraf:
    image: appwrite/telegraf:1.4.0
    container_name: fishdex-telegraf
    restart: unless-stopped
    networks:
      - fishdex-network
    <<: *x-logging

# =============================================================================
# VOLÚMENES Y REDES
# =============================================================================
volumes:
  mariadb-data:
  redis-data:
  influxdb-data:
  appwrite-uploads:
  appwrite-cache:
  appwrite-config:
  appwrite-certificates:
  appwrite-functions:
  caddy-data:
  caddy-config:

networks:
  fishdex-network:
    driver: bridge
