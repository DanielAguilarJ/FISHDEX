name: fishdex
description: "FishDex - App gamificada de identificación de peces por IA"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI y Material Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navegación
  go_router: ^14.2.7

  # Backend - Appwrite
  appwrite: 12.0.4

  # Mapas y Geolocalización
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  flutter_local_notifications: ^17.2.3

  # Cámara y Media
  camera: ^0.11.0+2
  video_player: ^2.9.1
  image_picker: ^1.1.2

  # Storage local / Cache
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Permisos
  permission_handler: ^11.3.1

  # Utilidades
  intl: ^0.19.0
  uuid: ^4.5.0
  http: ^1.2.2
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # Code generation
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

dependency_overrides:
  web: ^1.1.0
